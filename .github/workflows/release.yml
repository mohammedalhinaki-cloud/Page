name: Publish Android Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: وَرَقة v1.0.1
          body: |
            تحديث تطبيق وَرَقة: اختيار سورة بداية مستقلة لكل طالب، وعرض نافذة الحفظ لليوم السابق واليوم والغد.

            حمّل الملف app-debug.apk ثم ثبّته على جهاز Android.
            بيانات الطلاب محفوظة محليًا على الجهاز؛ استخدم النسخ الاحتياطي داخل التطبيق.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
