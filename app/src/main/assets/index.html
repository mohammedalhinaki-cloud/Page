<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#174c3b"><title>وَرَقَة — متابعة الحفظ</title>
<style>
:root{--green:#174c3b;--green2:#21644f;--mint:#e8f2ed;--bg:#f6f7f4;--ink:#18241e;--muted:#718078;--line:#e1e8e2;--gold:#d6a849;--red:#a2463c;--shadow:0 8px 28px #173a2810}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;font-size:15px}.app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:92px}.top{background:var(--green);color:white;padding:22px 19px 18px;border-radius:0 0 24px 24px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{font-size:23px;margin:0}.brand small{display:block;color:#cee0d6;margin-top:5px}.date{font-size:12px;color:#d4e5dc;text-align:left}.studentbar{display:flex;gap:9px;margin-top:18px}.select,.input{border:1px solid var(--line);background:white;border-radius:12px;padding:12px;color:var(--ink);font:inherit;min-width:0}.select{flex:1}.plus{width:46px;border:0;background:#d9ede3;color:var(--green);font-size:22px;border-radius:12px}.tabs{display:flex;gap:7px;padding:13px 16px 5px;overflow:auto}.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:12px;font:inherit}.tab.active{background:var(--mint);color:var(--green);font-weight:bold}.content{padding:12px 16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:var(--shadow)}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:8px}.title{font-size:20px;font-weight:bold;line-height:1.5}.sub{color:var(--muted);font-size:13px;line-height:1.7;margin-top:6px}.verse{font-size:21px;color:var(--green);font-weight:bold;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.btn{border:0;border-radius:13px;padding:13px 10px;font:inherit;font-weight:bold;cursor:pointer}.btn.good{background:var(--green);color:white}.btn.bad{background:#fbefec;color:var(--red)}.btn.light{background:var(--mint);color:var(--green)}.btn.outline{background:white;color:var(--green);border:1px solid #cbdacf}.btn.full{width:100%;margin-top:10px}.btn.small{padding:9px 11px;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#f8faf8;border-radius:13px;padding:12px 8px;text-align:center}.metric b{display:block;font-size:21px;color:var(--green)}.metric span{font-size:11px;color:var(--muted)}.sectionTitle{font-size:16px;margin:5px 0 12px}.empty{text-align:center;padding:23px;color:var(--muted);line-height:1.8}.tag{display:inline-block;background:#f1f4f1;color:#4d665a;border-radius:20px;padding:5px 9px;font-size:11px}.review{border-right:3px solid var(--gold)}.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:14px;background:#f8faf8;border-radius:14px}.stat b{display:block;font-size:20px;color:var(--green)}.stat span{font-size:12px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:2}.bottomin{max-width:680px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px max(7px,env(safe-area-inset-bottom))}.nav{border:0;background:transparent;color:var(--muted);padding:7px 3px;font:inherit;font-size:11px}.nav span{display:block;font-size:19px;margin-bottom:3px}.nav.active{color:var(--green);font-weight:bold}.formrow{margin:12px 0}.formrow label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.choice{display:flex;gap:7px}.choice button{flex:1}.checkline{display:flex;align-items:center;gap:8px;color:#45574c;font-size:13px;margin:9px 0}.listitem{padding:13px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.badge{font-size:11px;border-radius:20px;padding:5px 9px;background:var(--mint);color:var(--green)}.danger{color:var(--red)}.dategrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{background:#fff8e8;color:#725824;padding:11px 13px;border-radius:12px;font-size:12px;line-height:1.7;margin:10px 0}.modal{position:fixed;inset:0;background:#10231bbb;display:none;align-items:flex-end;justify-content:center;z-index:5}.modal.show{display:flex}.sheet{background:white;border-radius:22px 22px 0 0;padding:21px;width:min(100%,680px);max-height:86vh;overflow:auto}.sheet h2{font-size:18px;margin:0 0 12px}.x{float:left;border:0;background:#f1f4f1;border-radius:50%;width:31px;height:31px;font-size:17px}.divider{height:1px;background:var(--line);margin:13px 0}.progress{height:8px;background:#e8eee9;border-radius:8px;overflow:hidden;margin:9px 0}.progress i{height:100%;display:block;background:var(--green);border-radius:8px}.footnote{font-size:11px;color:var(--muted);line-height:1.8;text-align:center;padding:12px}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div><h1>وَرَقَة</h1><small>متابعة الحفظ والمراجعة</small></div><div class="date" id="today"></div></div><div class="studentbar"><select id="studentSelect" class="select" onchange="render()"></select><button class="plus" onclick="openModal('studentModal')" aria-label="إضافة طالب">+</button></div></header><div class="tabs" id="tabs"></div><main class="content" id="content"></main></div><nav class="bottom"><div class="bottomin" id="nav"></div></nav>
<div class="modal" id="studentModal" onclick="if(event.target===this)closeModal('studentModal')"><div class="sheet"><button class="x" onclick="closeModal('studentModal')">×</button><h2>إضافة طالب</h2><div class="formrow"><label>اسم الطالب</label><input id="newStudent" class="input" style="width:100%" placeholder="اكتب الاسم"></div><button class="btn good full" onclick="addStudent()">إضافة</button></div></div>
<div class="modal" id="otherModal" onclick="if(event.target===this)closeModal('otherModal')"><div class="sheet"><button class="x" onclick="closeModal('otherModal')">×</button><h2>تسجيل حالة أخرى</h2><div class="formrow"><label>السبب أو الحالة</label><input id="otherReason" class="input" style="width:100%" placeholder="اكتب السبب"></div><label class="checkline"><input type="checkbox" id="deferOther"> أجّل الحفظ إلى اليوم الدراسي القادم</label><button class="btn good full" onclick="saveOther()">حفظ الحالة</button></div></div>
<div class="modal" id="holidayModal" onclick="if(event.target===this)closeModal('holidayModal')"><div class="sheet"><button class="x" onclick="closeModal('holidayModal')">×</button><h2>إضافة إجازة</h2><div class="formrow"><label>نوع الإجازة</label><div class="choice"><button id="singleBtn" class="btn light" onclick="holidayMode='single';holidayForm()">يوم واحد</button><button id="rangeBtn" class="btn outline" onclick="holidayMode='range';holidayForm()">فترة</button></div></div><div class="dategrid"><div class="formrow"><label>من</label><input class="input" id="holidayStart" type="date" style="width:100%"></div><div class="formrow" id="endWrap" style="display:none"><label>إلى</label><input class="input" id="holidayEnd" type="date" style="width:100%"></div></div><div class="formrow"><label>السبب (اختياري)</label><input class="input" id="holidayReason" style="width:100%" placeholder="مثال: إجازة منتصف الفصل"></div><button class="btn good full" onclick="addHoliday()">حفظ الإجازة</button></div></div>
<script>
const surahs=[
[41,'فصلت',54,477],[42,'الشورى',53,483],[43,'الزخرف',89,489],[44,'الدخان',59,496],[45,'الجاثية',37,499],[46,'الأحقاف',35,502],[47,'محمد',38,507],[48,'الفتح',29,511],[49,'الحجرات',18,515],[50,'ق',45,518],[51,'الذاريات',60,520],[52,'الطور',49,523],[53,'النجم',62,526],[54,'القمر',55,528],[55,'الرحمن',78,531],[56,'الواقعة',96,534],[57,'الحديد',29,537],[58,'المجادلة',22,542],[59,'الحشر',24,545],[60,'الممتحنة',13,549],[61,'الصف',14,551],[62,'الجمعة',11,553],[63,'المنافقون',11,554],[64,'التغابن',18,556],[65,'الطلاق',12,558],[66,'التحريم',12,560],[67,'الملك',30,562],[68,'القلم',52,564],[69,'الحاقة',52,566],[70,'المعارج',44,568],[71,'نوح',28,570],[72,'الجن',28,572],[73,'المزمل',20,574],[74,'المدثر',56,575],[75,'القيامة',40,577],[76,'الإنسان',31,578],[77,'المرسلات',50,580],[78,'النبأ',40,582],[79,'النازعات',46,583],[80,'عبس',42,585],[81,'التكوير',29,586],[82,'الانفطار',19,587],[83,'المطففين',36,587],[84,'الانشقاق',25,589],[85,'البروج',22,590],[86,'الطارق',17,591],[87,'الأعلى',19,591],[88,'الغاشية',26,592],[89,'الفجر',30,593],[90,'البلد',20,594],[91,'الشمس',15,595],[92,'الليل',21,595],[93,'الضحى',11,596],[94,'الشرح',8,596],[95,'التين',8,597],[96,'العلق',19,597],[97,'القدر',5,598],[98,'البينة',8,598],[99,'الزلزلة',8,599],[100,'العاديات',11,599],[101,'القارعة',11,600],[102,'التكاثر',8,600],[103,'العصر',3,601],[104,'الهمزة',9,601],[105,'الفيل',5,602],[106,'قريش',4,602],[107,'الماعون',7,602],[108,'الكوثر',3,603],[109,'الكافرون',6,603],[110,'النصر',3,603],[111,'المسد',5,603],[112,'الإخلاص',4,604],[113,'الفلق',5,604],[114,'الناس',6,604]
];
const defaults={students:[],selected:null,portion:'full',includeIntro:true,holidays:[],records:{},offset:{},majorCursor:{},startDate:null,tab:'today',page:'home'};
let db=load(),holidayMode='single';function load(){try{return {...defaults,...JSON.parse(localStorage.getItem('waraqah-v1')||'{}')}}catch(e){return {...defaults}}}function save(){localStorage.setItem('waraqah-v1',JSON.stringify(db))}
function uid(){return Math.random().toString(36).slice(2,10)}function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseDate(s){return new Date(s+'T12:00:00')}function arDate(s){return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{weekday:'long',day:'numeric',month:'long'}).format(parseDate(s))}function isWork(d){let day=parseDate(d).getDay();return [0,1,2,3].includes(day)&&!db.holidays.some(h=>d>=h.start&&d<=h.end)}function nextWork(d){let x=parseDate(d);do{x.setDate(x.getDate()+1)}while(!isWork(dateKey(x)));return dateKey(x)}function shiftWork(d,n){let x=d;for(let i=0;i<n;i++)x=nextWork(x);return x}
function portionLines(){return db.portion==='half'?7.5:db.portion==='quarter'?3.75:15}function finalRangeAllowed(page){return page>=477&&page<=521}
function makeSchedule(){let out=[];if(db.includeIntro)out.push({id:'intro',s:'الناس + الفلق + الإخلاص',a:1,b:0,p:604,lines:0,intro:true});for(let [n,name,count,page] of [...surahs].reverse()){if(n>=112)continue;let endPage=surahs.find(x=>x[0]===n+1)?.[3]??page;let pages=Math.max(1,endPage-page);let totalLines=pages*15;let unit=portionLines();let chunks=Math.max(1,Math.round(totalLines/unit));if(db.portion==='quarter'&&!finalRangeAllowed(page))chunks=Math.max(1,Math.round(totalLines/(db.portionBeforeQuarter||15)));chunks=Math.min(count,chunks);for(let i=0;i<chunks;i++){let a=Math.floor(i*count/chunks)+1,b=Math.floor((i+1)*count/chunks);if(b<a)b=a;out.push({id:`${n}-${a}-${b}`,s:name,a,b,p:page,lines:Math.max(1,Math.round(totalLines/chunks))})}}
return out}
function student(){return db.students.find(x=>x.id===db.selected)}function records(){let s=student();if(!s)return{};return db.records[s.id]||{}}function storeRecords(r){let s=student();if(s){db.records[s.id]=r;save()}}function getOffset(){let s=student();return s?(db.offset[s.id]||0):0}function saveOffset(v){let s=student();if(s){db.offset[s.id]=v;save()}}
function scheduleFor(d){let start=db.startDate||dateKey();if(d<start)return -1;let i=0,x=parseDate(start);while(dateKey(x)<d){if(isWork(dateKey(x)))i++;x.setDate(x.getDate()+1)}return i+(isWork(d)?0:-1)}
function assignment(d){let offset=getOffset();let ix=scheduleFor(d)-offset;let arr=makeSchedule();return ix<0?null:arr[ix]||null}function previousWork(d){let x=parseDate(d);do{x.setDate(x.getDate()-1)}while(!isWork(dateKey(x)));return dateKey(x)}function surahLabel(x){return x?.intro?x.s:`${x?.s||'—'} ${x?.a||''}${x?.b&&x.b!==x.a?'–'+x.b:''}`}
function recordKey(d){return d}function dayRecord(d){return records()[recordKey(d)]||{}}function setDayRecord(d,obj){let r=records();r[d]={...(r[d]||{}),...obj};storeRecords(r)}
function init(){if(!db.startDate)db.startDate=dateKey();if(!db.students.length){let s={id:uid(),name:'طالب جديد'};db.students=[s];db.selected=s.id;save()}if(!db.selected)db.selected=db.students[0]?.id;document.getElementById('today').textContent=new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{day:'numeric',month:'short'}).format(new Date());render()}
function render(){let sel=document.getElementById('studentSelect');if(!db.students.length){sel.innerHTML='';}else{sel.innerHTML=db.students.map(s=>`<option value="${s.id}" ${s.id===db.selected?'selected':''}>${escapeHtml(s.name)}</option>`).join('');db.selected=sel.value;save()}renderNav();let c=document.getElementById('content');if(!student()){c.innerHTML='<div class="card empty">أضف طالبًا للبدء.</div>';return}switch(db.page){case'stats':c.innerHTML=statsPage();break;case'settings':c.innerHTML=settingsPage();break;case'holidays':c.innerHTML=holidaysPage();break;default:c.innerHTML=homePage()} }
function renderNav(){let items=[['home','اليوم','⌂'],['stats','الإحصاءات','▤'],['holidays','الإجازات','▦'],['settings','الإعدادات','⚙']];document.getElementById('nav').innerHTML=items.map(([id,label,ico])=>`<button class="nav ${db.page===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${label}</button>`).join('')}
function go(p){db.page=p;save();render()}function homePage(){let d=dateKey(),s=student(),task=assignment(d),r=dayRecord(d),y=previousWork(d),yr=dayRecord(y);let minor=yr.status==='memorized'?taskById(yr.task):'لا يوجد حفظ مُسجّل بالأمس';let major=majorAssignment(d);let arr=makeSchedule();let ix=task?arr.findIndex(q=>q.id===task.id):arr.length;let pct=Math.max(0,Math.min(100,Math.round(ix/arr.length*100)));let statusText={memorized:'حفظ',missed:'لم يحفظ',absent:'غائب',other:r.other?'حالة أخرى':''};return `<section class="card"><div class="eyebrow">حفظ اليوم · ${arDate(d)}</div>${!isWork(d)?`<div class="empty">لا يوجد دوام اليوم. الدوام من الأحد إلى الأربعاء.</div>`:task?`<div class="title">${escapeHtml(surahLabel(task))}</div><div class="sub">${task.intro?'مراجعة تمهيدية':`سورة ${task.s} · الآيات ${task.a}–${task.b} · نحو ${task.lines} أسطر`}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="row sub"><span>تقدم الخطة</span><span>${pct}%</span></div>${r.status?`<div class="notice">تم تسجيل اليوم: ${statusText[r.status]||r.other||''}${r.status==='missed'?' · تأجل المقطع إلى اليوم الدراسي القادم':''}</div>`:`<div class="actions"><button class="btn good" onclick="markMemorized()">حفظ ✓</button><button class="btn bad" onclick="markMissed()">لم يحفظ</button></div><div class="actions"><button class="btn outline" onclick="markAbsent()">غائب</button><button class="btn outline" onclick="openModal('otherModal')">أخرى</button></div>`}`:`<div class="empty">اكتملت الخطة إلى سورة فصلت 🎉</div>`}</section><section class="card"><div class="row"><div><div class="eyebrow">المراجعة الصغرى</div><div class="title" style="font-size:17px">${escapeHtml(minor)}</div></div><span class="badge">تلقائية</span></div><div class="sub">تُسجّل مراجعة حفظ اليوم السابق تلقائيًا؛ لا تحتاج إلى زر مستقل.</div></section><section class="card review"><div class="row"><div><div class="eyebrow">المراجعة الكبرى الاختيارية</div><div class="title" style="font-size:18px">صفحتا اليوم ${major?`· ${major.from}–${major.to}`:'· اكتملت'}</div></div><span class="tag">من الناس إلى فصلت</span></div><div class="sub">${major?`سورة ${major.fromSurah} ثم ${major.toSurah} · صفحتان متتاليتان`:'تمت مراجعة الصفحات حتى سورة فصلت.'}</div><div id="majorStatus" class="sub">${r.major?'تم تسجيل مراجعة اليوم ✓':''}</div><button class="btn light full" onclick="markMajor()">${r.major?'تمت المراجعة ✓':'تسجيل إنجاز المراجعة الكبرى'}</button></section><section class="card"><h3 class="sectionTitle">ملخص الطالب</h3><div class="metrics">${metric(count('memorized'),'مقاطع حُفظت')}${metric(count('missed'),'لم تُحفظ')}${metric(count('absent'),'غياب')}</div></section>`}
function metric(v,l){return `<div class="metric"><b>${v}</b><span>${l}</span></div>`}
function markMemorized(){let d=dateKey(),t=assignment(d);if(!t)return;setDayRecord(d,{status:'memorized',task:t.id,time:Date.now()});render()}function markMissed(){let d=dateKey(),t=assignment(d);if(!t)return;setDayRecord(d,{status:'missed',task:t.id,time:Date.now()});saveOffset(getOffset()+1);render()}function markAbsent(){let d=dateKey(),t=assignment(d);setDayRecord(d,{status:'absent',task:t?.id||null,time:Date.now()});render()}function saveOther(){let reason=document.getElementById('otherReason').value.trim();if(!reason){alert('اكتب السبب أولًا');return}let d=dateKey(),t=assignment(d),defer=document.getElementById('deferOther').checked;setDayRecord(d,{status:'other',other:reason,task:t?.id||null,time:Date.now()});if(defer)saveOffset(getOffset()+1);closeModal('otherModal');render()}
function majorAssignment(d){let s=student();if(!s)return null;let day=dayRecord(d);if(day.major)return{from:day.majorFrom,to:day.majorTo,fromSurah:surahAtPage(day.majorFrom),toSurah:surahAtPage(day.majorTo)};let cursor=db.majorCursor[s.id]??604;let from=cursor,to=Math.max(477,cursor-1);if(from<477)return null;return{from,to,fromSurah:surahAtPage(from),toSurah:surahAtPage(to)}}function surahAtPage(p){let found=[...surahs].reverse().find(x=>x[3]<=p);return found?.[1]||'فصلت'}function markMajor(){let d=dateKey(),m=majorAssignment(d);if(!m)return;setDayRecord(d,{major:true,majorFrom:m.from,majorTo:m.to});let s=student();db.majorCursor[s.id]=Math.max(476,m.to-1);save();render()}
function count(type){return Object.values(records()).filter(x=>x.status===type).length}function statsPage(){let r=Object.values(records()),mem=count('memorized'),miss=count('missed'),abs=count('absent'),other=r.filter(x=>x.status==='other').length,major=r.filter(x=>x.major).length,minor=r.filter(x=>x.status==='memorized').length;let arr=makeSchedule(),done=Math.min(mem,arr.length);return `<div class="card"><div class="eyebrow">إحصاءات ${escapeHtml(student().name)}</div><h2 class="sectionTitle">ملخص الإنجاز</h2><div class="statsgrid">${stat(mem,'مقاطع حُفظت')}${stat(miss,'مقاطع تأجلت')}${stat(abs,'أيام غياب')}${stat(other,'حالات أخرى')}${stat(minor,'مراجعات صغرى تلقائية')}${stat(major,'مراجعات كبرى')}</div><div class="divider"></div><div class="row"><span>إنجاز الخطة</span><b>${done} / ${arr.length}</b></div><div class="progress"><i style="width:${Math.round(done/Math.max(1,arr.length)*100)}%"></i></div><div class="sub">المراجعة الصغرى تُحسب تلقائيًا من أيام الحفظ المسجلة.</div></div><div class="card"><h3 class="sectionTitle">آخر السجلات</h3>${Object.entries(records()).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12).map(([d,x])=>`<div class="listitem row"><div><b>${arDate(d)}</b><div class="sub">${escapeHtml(x.other||taskById(x.task)||'')}</div></div><span class="badge">${({memorized:'حفظ',missed:'لم يحفظ',absent:'غائب',other:'أخرى'})[x.status]||''}${x.major?' · مراجعة كبرى':''}</span></div>`).join('')||'<div class="empty">لا توجد سجلات بعد.</div>'}</div>`}function taskById(id){return makeSchedule().find(x=>x.id===id)?surahLabel(makeSchedule().find(x=>x.id===id)):''}function stat(n,l){return `<div class="stat"><b>${n}</b><span>${l}</span></div>`}
function settingsPage(){return `<div class="card"><div class="eyebrow">الخطة</div><h2 class="sectionTitle">مقدار الحفظ اليومي</h2><div class="choice"><button class="btn ${db.portion==='full'?'good':'outline'}" onclick="setPortion('full')">وجه كامل<br><small>15 سطرًا</small></button><button class="btn ${db.portion==='half'?'good':'outline'}" onclick="setPortion('half')">نصف وجه<br><small>7.5 أسطر</small></button><button class="btn ${db.portion==='quarter'?'good':'outline'}" onclick="setPortion('quarter')">ربع وجه<br><small>3.75 أسطر</small></button></div><div class="notice">الربع متاح في آخر أجزاء الخطة فقط (صفحات 477–521)، ويُعامل كمقدار تمهيدي. تقسيم الآيات تقديري ومتوازن، ويُختم كل مقطع عند حدّ السورة.</div><label class="checkline"><input type="checkbox" ${db.includeIntro?'checked':''} onchange="db.includeIntro=this.checked;save();render()"> إضافة مراجعة تمهيدية: الناس والفلق والإخلاص</label><div class="divider"></div><h3 class="sectionTitle">أيام الدوام</h3><div class="sub">الأحد، الاثنين، الثلاثاء، الأربعاء. لا تُنشأ مهام حفظ في بقية الأيام، وتُرحّل المقاطع المؤجلة إلى يوم الدوام التالي.</div></div><div class="card"><div class="eyebrow">إدارة الطلاب</div><div class="row"><div><b>${escapeHtml(student().name)}</b><div class="sub">${db.students.length} طالب في هذا الجهاز</div></div><button class="btn light small" onclick="openModal('studentModal')">إضافة طالب +</button></div>${db.students.map(s=>`<div class="listitem row"><span>${escapeHtml(s.name)}</span>${s.id===db.selected?'<span class="badge">الحالي</span>':''}</div>`).join('')}</div><div class="footnote">تُحفظ البيانات على هذا الجهاز فقط. احفظ نسخة احتياطية عبر زر التصدير قبل تغيير الجهاز.</div><button class="btn outline full" onclick="exportData()">تصدير نسخة احتياطية</button><label class="btn outline full" style="display:block;text-align:center;cursor:pointer">استعادة نسخة احتياطية<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label>`}
function holidaysPage(){let hs=[...db.holidays].sort((a,b)=>a.start.localeCompare(b.start));return `<div class="card"><div class="row"><div><div class="eyebrow">التقويم</div><h2 class="sectionTitle">الإجازات</h2></div><button class="btn good small" onclick="openModal('holidayModal')">إضافة إجازة +</button></div><div class="sub">تستثنى أيام الإجازة من جدول الدوام، فينتقل الحفظ تلقائيًا إلى أول يوم دوام بعدها.</div></div><div class="card">${hs.length?hs.map((h,i)=>`<div class="listitem row"><div><b>${arDate(h.start)}${h.end!==h.start?' — '+arDate(h.end):''}</b><div class="sub">${escapeHtml(h.reason||'إجازة')}</div></div><button class="btn bad small" onclick="removeHoliday(${i})">حذف</button></div>`).join(''):'<div class="empty">لم تُسجّل إجازات بعد.</div>'}</div>`}
function addStudent(){let name=document.getElementById('newStudent').value.trim();if(!name){alert('اكتب اسم الطالب');return}let s={id:uid(),name};db.students.push(s);db.selected=s.id;save();closeModal('studentModal');document.getElementById('newStudent').value='';render()}function setPortion(p){if(p==='quarter'&&!confirm('سيُطبّق ربع الوجه فقط في صفحات 477–521. متابعة؟'))return;db.portion=p;save();render()}function removeHoliday(i){if(confirm('حذف الإجازة؟')){let h=[...db.holidays].sort((a,b)=>a.start.localeCompare(b.start));db.holidays=db.holidays.filter(x=>x!==h[i]);save();render()}}
function holidayForm(){document.getElementById('endWrap').style.display=holidayMode==='range'?'block':'none';document.getElementById('singleBtn').className='btn '+(holidayMode==='single'?'light':'outline');document.getElementById('rangeBtn').className='btn '+(holidayMode==='range'?'light':'outline')}function addHoliday(){let start=document.getElementById('holidayStart').value,end=holidayMode==='range'?document.getElementById('holidayEnd').value:start;if(!start||!end||end<start){alert('تحقق من تاريخ الإجازة');return}db.holidays.push({start,end,reason:document.getElementById('holidayReason').value.trim()});save();closeModal('holidayModal');render()}function openModal(id){document.getElementById(id).classList.add('show')}function closeModal(id){document.getElementById(id).classList.remove('show')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='waraqah-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!Array.isArray(x.students)||!x.records)throw 0;db={...defaults,...x};save();render();alert('تمت استعادة النسخة')}catch(_){alert('ملف النسخة غير صالح')}};rd.readAsText(f)}function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();
</script></body></html>
